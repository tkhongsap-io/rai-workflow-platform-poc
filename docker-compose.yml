# Postgres 16 for local development and CI (ADR-0003, D04; W0-02 section 5; created by W1-00).
# POSTGRES_PORT selects the loopback host port (default 54320). Per-ticket isolation:
#   POSTGRES_PORT=543<nn> docker compose -p rai-<ticket-id-lowercase> up -d --wait
# The superuser below is used only by the init script; the application connects as the
# W0-04 roles rai_owner / rai_app / rai_operator that docker/postgres/init creates.
services:
  postgres:
    image: postgres:16.15-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local   # synthetic, loopback-only development credential; production uses custody (D10)
      POSTGRES_DB: rai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rai"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro   # creates rai_owner, rai_app, rai_operator with the W0-04 grants (synthetic passwords rai_owner / rai_app / rai_operator)
volumes:
  pgdata: {}
